# EHN One - Nginx Configuration
# Hosted ONLY on admin.kedvasshygieneproducts.com
# Main domain (kedvasshygieneproducts.com) is NOT touched

limit_req_zone $binary_remote_addr zone=ehnone_api:10m rate=30r/s;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name admin.kedvasshygieneproducts.com;

    location /.well-known/acme-challenge/ {
        root /var/www/ehnone/certbot;
        allow all;
    }

    location / {
        return 301 https://admin.kedvasshygieneproducts.com$request_uri;
    }
}

# admin.kedvasshygieneproducts.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.kedvasshygieneproducts.com;
    server_tokens off;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/admin.kedvasshygieneproducts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.kedvasshygieneproducts.com/privkey.pem;

    root /var/www/ehnone/current/frontend/build;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static assets - long cache
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API proxy - port 4100 (non-standard, localhost only)
    location /api/ {
        limit_req zone=ehnone_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:4100/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # HTML - no cache (always fetch fresh index.html with new JS/CSS hashes)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/ehnone-access.log;
    error_log /var/log/nginx/ehnone-error.log;
}
